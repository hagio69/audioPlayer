name: hagio_audio_player
description: "hagioAudioPlayer - iOS/Android 로컬 오디오 플레이어"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 재생 엔진 / 백그라운드 재생 / 오디오 세션
  just_audio: ^0.10.0
  audio_service: ^0.18.15
  audio_session: ^0.2.0

  # 파일·폴더 선택, 권한
  file_picker: ^10.0.0
  permission_handler: ^12.0.0
  device_info_plus: ^11.0.0   # Android SDK 버전 확인(READ_MEDIA_AUDIO vs READ_EXTERNAL_STORAGE)

  # 로컬 상태 저장
  shared_preferences: ^2.3.0

  # 상태 관리
  provider: ^6.1.2

  # 메타데이터(제목/아티스트/앨범/길이) 파싱 - 순수 Dart, iOS/Android 공통
  audio_metadata_reader: ^1.3.0

  # 경로 처리
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"